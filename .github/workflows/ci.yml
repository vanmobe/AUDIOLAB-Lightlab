name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: npm ci
      - run: npm run format:check
      - run: dotnet format Lightlab.slnx --verify-no-changes --no-restore
      - run: npm run verify
